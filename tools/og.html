<!doctype html>
<!-- The Open Graph card. `just og` screenshots this at 1200x630 into public/og.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <style>
      @font-face {
        font-family: "Mona Sans";
        src: url("../public/fonts/mona-sans.woff2") format("woff2-variations");
        font-weight: 200 900;
        font-stretch: 75% 125%;
      }
      @font-face {
        font-family: "Fragment Mono";
        src: url("../public/fonts/fragment-mono.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0a;
        color: #ecebe6;
        font-family: "Mona Sans", sans-serif;
      }
      canvas {
        position: absolute;
        inset: 0;
      }
      .label {
        position: absolute;
        top: 40px;
        margin: 0;
        font: 20px/1.3 "Fragment Mono", monospace;
        color: #8f8c85;
      }
      .left {
        left: 48px;
      }
      .left b {
        color: #ff5b2e;
        font-weight: 400;
      }
      .right {
        right: 48px;
      }
      .foot {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 40px;
        padding-top: 22px;
        border-top: 1px solid #2a2925;
        display: flex;
        justify-content: space-between;
        align-items: end;
      }
      h1 {
        margin: 0;
        font-size: 76px;
        font-weight: 800;
        font-stretch: 75%;
        line-height: 0.9;
        letter-spacing: -0.03em;
      }
      .role {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 300;
        font-stretch: 125%;
        color: #8f8c85;
      }
    </style>
  </head>
  <body>
    <canvas width="1200" height="630"></canvas>
    <p class="label left"><b>01</b>/09 English</p>
    <p class="label right">AI systems that answer to numbers</p>
    <div class="foot">
      <h1>Arjun Krishnan Suresh</h1>
      <p class="role">AI engineer and researcher</p>
    </div>
    <script>
      // The hero's look, frozen: the name sampled into particles, edges bright, fills soft, dust behind.
      const W = 1200;
      const H = 630;
      const g = document.querySelector("canvas").getContext("2d");
      let seed = 7;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
      document.fonts.load('800 300px "Mona Sans"').then(() => {
        const m = document.createElement("canvas");
        m.width = W;
        m.height = H;
        const s = m.getContext("2d");
        s.font = '800 300px "Mona Sans"';
        s.fillStyle = "#fff";
        s.textAlign = "center";
        s.fillText("Arjun", W / 2, 360);
        const data = s.getImageData(0, 0, W, H).data;
        const on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && data[(y * W + x) * 4 + 3] > 127;
        const fill = [];
        const edge = [];
        for (let y = 0; y < H; y += 2)
          for (let x = 0; x < W; x += 2) {
            if (!on(x, y)) continue;
            (on(x - 2, y) && on(x + 2, y) && on(x, y - 2) && on(x, y + 2) ? fill : edge).push([x, y]);
          }
        g.fillStyle = "#0b0b0a";
        g.fillRect(0, 0, W, H);
        const dot = (x, y, r, a) => {
          g.globalAlpha = a;
          g.beginPath();
          g.arc(x, y, r, 0, Math.PI * 2);
          g.fill();
        };
        g.fillStyle = "#ecebe6";
        for (let i = 0; i < 900; i++) dot(rand() * W, rand() * H, 0.6 + rand() * 2.4, 0.08 + rand() * 0.18);
        for (let i = 0; i < 9000; i++) {
          const [x, y] = fill[Math.floor(rand() * fill.length)];
          dot(x + (rand() - 0.5) * 2, y + (rand() - 0.5) * 2, 0.7 + rand() * 0.7, 0.3 + rand() * 0.5);
        }
        for (let i = 0; i < 6000; i++) {
          const [x, y] = edge[Math.floor(rand() * edge.length)];
          dot(x + (rand() - 0.5) * 0.6, y + (rand() - 0.5) * 0.6, 0.6 + rand() * 0.5, 1);
        }
        g.globalAlpha = 1;
      });
    </script>
  </body>
</html>
